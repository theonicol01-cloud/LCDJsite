<!-- ================= AVIS (carrousel) ================= -->
<section class="section reviews" id="avis">
  <div class="wrap">
    <div class="reviews-head reveal">
      <div>
        <span class="eyebrow">Avis clients</span>
        <h2>Ils en parlent mieux que nous</h2>
      </div>
      <div class="reviews-tools">
        <div class="reviews-score">
          <span class="g">{{icon:google}}</span>
          <b>5/5</b>
          <div>{{icon:stars5}}<small>Avis Google</small></div>
        </div>
        <div class="carousel-nav">
          <button type="button" class="carousel-btn" data-dir="-1" aria-label="Avis précédent">{{icon:arrow}}</button>
          <button type="button" class="carousel-btn" data-dir="1" aria-label="Avis suivant">{{icon:arrow}}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="carousel" tabindex="0" aria-label="Avis de nos clients">
    <figure class="review">
      {{icon:stars5}}
      <p class="review-title">« Un vrai plaisir au quotidien »</p>
      <blockquote>Depuis quelques semaines, La Cuisine de Jeanine nourrit notre équipe au bureau. Chaque repas déclenche son lot de « hmmm », de « trop bon » et de « c'est quoi comme ingrédient ? ». Des plats savoureux, généreux, faits avec soin, qui transforment vraiment la pause déjeuner.</blockquote>
      <figcaption class="who"><span class="avatar">AA</span><div><b>Agence Arise</b><small>Client entreprise</small></div></figcaption>
    </figure>
    <figure class="review">
      {{icon:stars5}}
      <p class="review-title">« Une nouvelle recette à chaque fois »</p>
      <blockquote>Cela fait déjà la 5ème fois que l'on retrouve une mousse au chocolat et quel plaisir à chaque fois de découvrir une nouvelle recette ! Je recommande vivement à toute personne voulant allier plaisir et découverte pendant sa pause déj.</blockquote>
      <figcaption class="who"><span class="avatar">A</span><div><b>Adam</b><small>Avis Google</small></div></figcaption>
    </figure>
    <figure class="review">
      {{icon:stars5}}
      <p class="review-title">« Franchement excellente »</p>
      <blockquote>J'ai essayé la mousse au chocolat et franchement elle est excellente 🔥🔥🔥</blockquote>
      <figcaption class="who"><span class="avatar">AR</span><div><b>Ando R.</b><small>Avis Google</small></div></figcaption>
    </figure>
    <figure class="review">
      {{icon:stars5}}
      <p class="review-title">« Un délice pour les papilles »</p>
      <blockquote>Le bonheur de découvrir son plat sur son lieu de travail… un délice pour les papilles.</blockquote>
      <figcaption class="who"><span class="avatar">AC</span><div><b>A. C.</b><small>Avis Google</small></div></figcaption>
    </figure>
    <a class="review review-more" href="https://share.google/crG01oWA2XvBEBfjL" target="_blank" rel="noopener">
      <span class="g">{{icon:google}}</span>
      <p class="review-title">Tous nos avis sur Google</p>
      <span class="sol-link">Lire les avis <i>{{icon:arrow}}</i></span>
    </a>
  </div>
</section>
